<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vahac Games</title>
  <meta name="description" content="Local index page for all games in the vahac-games repository.">
  <style>
    body {
      margin: 0;
      background: #0a0f1e;
    }

    .hub-wrapper {
      --hub-bg-primary: #0a0f1e;
      --hub-bg-secondary: #111827;
      --hub-bg-card: #1a2236;
      --hub-bg-card-hover: #1f2a42;
      --hub-bg-input: #0d1424;
      --hub-border: #2a3a5c;
      --hub-border-hover: #3a4d75;
      --hub-border-focus: #3b82f6;
      --hub-text-primary: #e2e8f0;
      --hub-text-secondary: #94a3b8;
      --hub-text-muted: #64748b;
      --hub-accent-blue: #3b82f6;
      --hub-accent-cyan: #22d3ee;
      --hub-font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', 'Consolas', monospace;
      --hub-font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --hub-radius: 8px;

      font-family: var(--hub-font-sans);
      color: var(--hub-text-primary);
      line-height: 1.6;
      max-width: 1180px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
      box-sizing: border-box;
    }

    .hub-wrapper *,
    .hub-wrapper *::before,
    .hub-wrapper *::after {
      box-sizing: border-box;
    }

    .hub-wrapper a {
      color: inherit;
    }

    .hub-wrapper :focus-visible {
      outline: 2px solid var(--hub-accent-cyan);
      outline-offset: 2px;
    }

    .hub-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---------- Site links ---------- */

    .hub-wrapper .hub-text-link {
      color: var(--hub-text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }

    .hub-wrapper .hub-text-link:hover {
      color: var(--hub-accent-cyan);
    }

    .hub-byline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 0.6rem;
      margin: 0.35rem 0 0;
      font-size: 0.88rem;
      color: var(--hub-text-muted);
    }

    .hub-byline a {
      border-bottom: 1px dotted var(--hub-border-hover);
    }

    .hub-byline a:hover {
      border-bottom-color: var(--hub-accent-cyan);
    }

    .hub-sep {
      color: var(--hub-border-hover);
    }

    /* ---------- Header ---------- */

    .hub-header {
      background: linear-gradient(135deg, #111827, #1a2236 45%, #0d1424);
      border: 1px solid var(--hub-border);
      border-radius: var(--hub-radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .hub-title {
      margin: 0;
      font-size: 1.8rem;
      line-height: 1.2;
    }

    .hub-subtitle {
      margin: 0.5rem 0 0;
      color: var(--hub-text-secondary);
      max-width: 70ch;
    }

    .hub-stats {
      margin: 0.75rem 0 0;
      font-size: 0.9rem;
      color: var(--hub-text-secondary);
    }

    .hub-stats strong {
      color: var(--hub-text-primary);
      font-weight: 600;
    }

    .hub-search-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .hub-search {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0.6rem 0.9rem;
      background: var(--hub-bg-input);
      border: 1px solid var(--hub-border);
      border-radius: 6px;
      color: var(--hub-text-primary);
      font: inherit;
      font-size: 0.95rem;
    }

    .hub-search::placeholder {
      color: var(--hub-text-muted);
    }

    .hub-search:focus {
      border-color: var(--hub-border-focus);
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .hub-count {
      font-size: 0.85rem;
      color: var(--hub-text-muted);
      white-space: nowrap;
    }

    /* ---------- Group chips ---------- */

    .hub-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 1.25rem;
    }

    .hub-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 36px;
      padding: 0.3rem 0.8rem;
      background: var(--hub-bg-secondary);
      border: 1px solid var(--hub-border);
      border-radius: 999px;
      color: var(--hub-text-secondary);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .hub-chip:hover {
      color: var(--hub-text-primary);
      border-color: var(--hub-border-hover);
    }

    .hub-chip[aria-pressed="true"] {
      color: var(--hub-text-primary);
      border-color: var(--hub-accent-blue);
      background: rgba(59, 130, 246, 0.15);
    }

    .hub-chip-n {
      font-family: var(--hub-font-mono);
      font-size: 0.75rem;
      color: var(--hub-text-muted);
    }

    .hub-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--hub-group, var(--hub-text-muted));
    }

    /* ---------- Groups and cards ---------- */

    .hub-section {
      margin-bottom: 1.75rem;
    }

    .hub-section-head {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
      line-height: 1.3;
    }

    .hub-section-head .hub-dot {
      width: 10px;
      height: 10px;
    }

    .hub-section-n {
      font-family: var(--hub-font-mono);
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--hub-text-muted);
    }

    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.8rem;
    }

    .hub-card {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.95rem 1rem;
      background: var(--hub-bg-card);
      border: 1px solid var(--hub-border);
      border-left: 3px solid var(--hub-group, var(--hub-border));
      border-radius: var(--hub-radius);
      transition: background 0.15s, border-color 0.15s;
    }

    .hub-card:hover {
      background: var(--hub-bg-card-hover);
      border-color: var(--hub-border-hover);
      border-left-color: var(--hub-group, var(--hub-border));
    }

    .hub-card-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
    }

    .hub-card-link {
      text-decoration: none;
    }

    .hub-card-link::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--hub-radius);
    }

    .hub-card-link:focus-visible {
      outline: none;
    }

    .hub-card-link:focus-visible::after {
      outline: 2px solid var(--hub-accent-cyan);
      outline-offset: 2px;
    }

    .hub-card-desc {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--hub-text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ---------- Empty state and footer ---------- */

    .hub-empty {
      margin: 2rem 0;
      text-align: center;
      color: var(--hub-text-secondary);
      overflow-wrap: anywhere;
    }

    .hub-footer {
      margin-top: 1.5rem;
      color: var(--hub-text-muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .hub-noscript {
      margin: 1rem 0;
      padding: 1rem;
      border: 1px solid var(--hub-border);
      border-radius: var(--hub-radius);
      color: var(--hub-text-primary);
    }

    /* ---------- Responsive ---------- */

    @media (max-width: 640px) {
      .hub-wrapper {
        padding: 1rem 0.75rem 2rem;
      }

      .hub-title {
        font-size: 1.5rem;
      }

      .hub-byline a {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
      }

      .hub-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .hub-chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        margin-right: -0.75rem;
        padding-right: 0.75rem;
        scrollbar-width: thin;
      }

      .hub-chip {
        flex-shrink: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hub-wrapper * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="hub-wrapper">
    <header class="hub-header">
      <h1 class="hub-title">Vahac Games</h1>
      <p class="hub-byline">
        <a class="hub-text-link" href="https://vahac.com/">vahac.com</a>
        <span class="hub-sep" aria-hidden="true">·</span>
        <a class="hub-text-link" href="https://vahac.com/games/">games page</a>
      </p>
      <p class="hub-subtitle">
        Every game in this repository. Each one is a standalone page that runs in the browser.
      </p>
      <p class="hub-stats" id="hub-stats"></p>
      <div class="hub-search-row">
        <label class="hub-sr" for="hub-search">Search games</label>
        <input class="hub-search" id="hub-search" type="search" autocomplete="off" spellcheck="false">
        <span class="hub-count" id="hub-count" aria-live="polite"></span>
      </div>
    </header>

    <nav class="hub-chips" id="hub-chips" aria-label="Filter by genre"></nav>

    <div id="hub-list"></div>

    <p class="hub-empty" id="hub-empty" hidden></p>

    <noscript>
      <p class="hub-noscript">This index is built with JavaScript. Without it, open any game folder's <code>index.html</code> directly.</p>
    </noscript>

    <p class="hub-footer" id="hub-footer"></p>
  </main>

  <script>
  (function () {
    'use strict';

    // ---------- Games and genres ----------

    // One entry per game folder, in folder order; group is a key from GROUPS below.
    // Adding a game: add its entry here and its line under the same genre in README's
    // Repository Structure. The counts on the page update by themselves.
    var GAMES = [
      {
        name: '2048 Game',
        folder: '2048-game',
        group: 'puzzle',
        description: 'Slide and merge tiles on a 4x4 board with arrow keys or swipes until you reach 2048, with undo of up to 10 moves, a best score and auto save.'
      },
      {
        name: 'Bad Sector',
        folder: 'bad-sector',
        group: 'arcade',
        description: 'Bounce the read head off the carriage and break the sectors of an unrolled disk platter: bad sectors take several hits, read-only ones never break, with bonuses and a Daily disk.'
      },
      {
        name: 'Bitmap Decoder',
        folder: 'bitmap-decoder',
        group: 'puzzle',
        description: 'Fill a nonogram whose clues are run-length encoding until a hidden 1-bit icon decodes into a hex dump: a daily icon with a streak, Endless boards and best times.'
      },
      {
        name: 'Byte Catcher',
        folder: 'byte-catcher',
        group: 'reflex',
        description: 'Encode the packets queued on a router interface before their TTL runs out: bytes to bits, prefix lengths to subnet masks and rwx to octal and back; three drops take the link down.'
      },
      {
        name: 'Defrag',
        folder: 'defrag',
        group: 'memory',
        description: 'Move file fragments between disk tracks until every file lies in one unbroken run, with fixed system blocks, files of different sizes, a solver hint, numbered levels and a Daily.'
      },
      {
        name: 'Flip-Flop',
        folder: 'flip-flop',
        group: 'tabletop',
        description: 'Play Reversi in 1s and 0s against a CPU at Easy, Normal or Hard, or a friend on one device, with popcount and hex scores, an XOR flip hint, undo and auto save.'
      },
      {
        name: 'Hash Cracker',
        folder: 'hash-cracker',
        group: 'memory',
        description: 'Crack a hidden key in 10 attempts in Easy, Normal or Hard from HIT and NEAR counts; the terminal prints the keys left and their entropy in bits, and streaks are saved.'
      },
      {
        name: 'Lost in /var',
        folder: 'lost-in-var',
        group: 'sim',
        description: 'Log in to a fake shell on a broken server and find the cause with real commands (ls, cd, cat, grep, tail, ps, df, kill), in a tutorial and two incidents, with chips for phones.'
      },
      {
        name: 'Minesweeper Game',
        folder: 'minesweeper',
        group: 'puzzle',
        description: 'Clear Easy, Medium or Hard boards with a safe first click, right-click flags and flood reveal, against the clock and your best time per difficulty.'
      },
      {
        name: 'On-Call Shift',
        folder: 'oncall-shift',
        group: 'arcade',
        description: 'Keep twelve servers green through a night on call: pick the right fix before each SLA runs out, stop cascades from a failed database and score your uptime in nines.'
      },
      {
        name: 'Patch Panel',
        folder: 'patch-panel',
        group: 'puzzle',
        description: 'Turn patch-cord tiles until every server, NAS and access point links up to the core switch, on 5x5 to 9x9 boards with wrap mode, locks and a shared Daily.'
      },
      {
        name: 'Pod Packer',
        folder: 'pod-packer',
        group: 'memory',
        description: 'Schedule pods onto cluster nodes with CPU and RAM bars under anti-affinity, a GPU taint and a draining node, on the fewest nodes with as few evictions and moves as you can.'
      },
      {
        name: 'Port Knocker',
        folder: 'port-knocker',
        group: 'memory',
        description: 'Watch a homelab patch panel flash a port-knocking sequence and knock it back in Forward, Reverse or Stride mode within the knock window, then take on the shared Daily.'
      },
      {
        name: 'Rack Reset',
        folder: 'rack-reset',
        group: 'puzzle',
        description: 'Clear the alarm LEDs on a rack front panel in as few presses as possible: each rack model flips LEDs under its own hex toggle mask, and a GF(2) solver sets the par.'
      },
      {
        name: 'Reaction Time Test',
        folder: 'reaction-time',
        group: 'reflex',
        description: 'Wait for the neon signal, then click, tap or press Space: four delay windows, false-start detection, and your current, best and average times over 10 rounds.'
      },
      {
        name: 'Regex Par',
        folder: 'regex-par',
        group: 'word',
        description: 'Write the shortest regular expression that catches every line on one list and none on the other, on 18 holes made from real nginx, cron, dmesg, docker and git lines, against par.'
      },
      {
        name: 'Snake Game',
        folder: 'snake-game',
        group: 'arcade',
        description: 'Steer the snake around a 30x30 grid with arrow keys, WASD or on-screen buttons at one of four speeds, eat energy nodes for points and beat your best score.'
      },
      {
        name: 'Sudoku Game',
        folder: 'sudoku',
        group: 'puzzle',
        description: 'Solve a freshly generated 9x9 Sudoku with hints, wrong digits shown in red, a restart, and progress saved after every move.'
      },
      {
        name: 'Swap Space Solitaire',
        folder: 'swap-space-solitaire',
        group: 'tabletop',
        description: 'Page all 52 cards out to /dev/sda-sdd in an open solitaire of skill: two-tap moves, 4 swap slots, numbered deals to replay, a daily deal and win streaks.'
      },
      {
        name: 'Typing Speed Test',
        folder: 'typing-speed-test',
        group: 'reflex',
        description: 'Type a random Easy, Medium or Hard sentence against a 60-second clock with live WPM and accuracy, and keep your best WPM.'
      },
      {
        name: 'Uptime Idle',
        folder: 'uptime-idle',
        group: 'sim',
        description: 'Grow an old laptop under the desk into a homelab rack: buy services and hardware while the power bill and incidents eat the income, with offline progress and migrations.'
      },
      {
        name: 'Cyberpunk Wordle',
        folder: 'wordle-game',
        group: 'word',
        description: 'Guess the hidden five-letter word in six tries on the physical or on-screen keyboard; letters turn green, amber or grey, and your round and wins are saved.'
      }
    ];

    // Genres in display order: puzzles first, then word, arcade, reflex and typing, memory and
    // logic, board and card games, and simulations.
    var GROUPS = [
      { key: 'puzzle', label: 'Puzzle', color: '#3b82f6' },
      { key: 'word', label: 'Word', color: '#10b981' },
      { key: 'arcade', label: 'Arcade', color: '#f59e0b' },
      { key: 'reflex', label: 'Reflex and Typing', color: '#22d3ee' },
      { key: 'memory', label: 'Memory and Logic', color: '#a855f7' },
      { key: 'tabletop', label: 'Board and Cards', color: '#ec4899' },
      { key: 'sim', label: 'Simulation', color: '#84cc16' }
    ];

    // The genre filter of the All chip.
    var ALL = 'all';

    // ---------- Search and filter logic (no DOM) ----------

    function indexGroups(groups) {
      var byKey = {};
      groups.forEach(function (group) { byKey[group.key] = group; });
      return byKey;
    }

    // One entry per game: the game, its genre and the lower-case text a search looks in (name,
    // description and genre label). A genre that GROUPS lacks stops the page with an error.
    function indexGames(games, groupByKey) {
      return games.map(function (game) {
        if (!Object.prototype.hasOwnProperty.call(groupByKey, game.group)) {
          throw new Error('Unknown group "' + game.group + '" for ' + game.folder);
        }
        var group = groupByKey[game.group];
        return {
          game: game,
          group: group,
          haystack: (game.name + ' ' + game.description + ' ' + group.label).toLowerCase()
        };
      });
    }

    // The words of a search: lower-case, split at whitespace, empty ones dropped.
    function queryWords(query) {
      return query.toLowerCase().split(/\s+/).filter(Boolean);
    }

    // True when every word occurs in the entry's text; no words at all match every entry.
    function matchesWords(entry, words) {
      return words.every(function (word) { return entry.haystack.indexOf(word) !== -1; });
    }

    function inGroup(entries, key) {
      return entries.filter(function (entry) { return entry.group.key === key; });
    }

    function byName(a, b) {
      return a.game.name.localeCompare(b.game.name, 'en', { sensitivity: 'base' });
    }

    // The sections to show, in GROUPS order: { group, entries } with the entries sorted by name.
    // Genres outside the filter and genres without a match are left out.
    function sectionsFor(matched, groupKey) {
      var sections = [];
      GROUPS.forEach(function (group) {
        if (groupKey !== ALL && groupKey !== group.key) return;
        var entries = inGroup(matched, group.key).sort(byName);
        if (entries.length) sections.push({ group: group, entries: entries });
      });
      return sections;
    }

    // How many matched games a chip counts: all of them on All, else those of its genre.
    function chipCount(matched, key) {
      return key === ALL ? matched.length : inGroup(matched, key).length;
    }

    // The genre filter after a chip click: clicking the active genre goes back to All.
    function nextGroup(current, clicked) {
      return clicked === current ? ALL : clicked;
    }

    // '' while every game is shown, else 'N of M'.
    function countLabel(shown, total) {
      return shown === total ? '' : shown + ' of ' + total;
    }

    function emptyMessage(query, groupKey) {
      return 'No game matches “' + query + '”' + (groupKey === ALL ? '.' : ' in this genre.');
    }

    // Over HTTP link to the folder with a trailing slash: `npx serve` (the launch.json preview)
    // redirects folder/index.html to /folder without one, and the game's relative style.css and
    // script.js then load from the root and 404. Opened from disk, a folder link would show a
    // directory listing, so file:// keeps the explicit index.html.
    function folderHref(folder, protocol) {
      return folder + (protocol === 'file:' ? '/index.html' : '/');
    }

    // ---------- Page state ----------

    var ENTRIES = indexGames(GAMES, indexGroups(GROUPS));
    var state = { query: '', group: ALL };
    var els = null;
    var chips = [];

    // ---------- DOM helpers ----------

    function make(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // The colour dot of a genre; decorative, so screen readers skip it.
    function dot(group) {
      var node = make('span', 'hub-dot');
      node.style.setProperty('--hub-group', group.color);
      node.setAttribute('aria-hidden', 'true');
      return node;
    }

    // ---------- Rendering ----------

    function renderHeader() {
      els.stats.appendChild(make('strong', null, String(GAMES.length)));
      els.stats.appendChild(document.createTextNode(' games in '));
      els.stats.appendChild(make('strong', null, String(GROUPS.length)));
      els.stats.appendChild(document.createTextNode(' genres'));
      els.search.placeholder = 'Search ' + GAMES.length + ' games by name or genre  (press /)';
      els.footer.textContent = 'Local repository index page · ' + GAMES.length + ' games';
    }

    function createChip(key, label, group) {
      var button = make('button', 'hub-chip');
      var count = make('span', 'hub-chip-n');
      button.type = 'button';
      if (group) button.appendChild(dot(group));
      button.appendChild(document.createTextNode(label));
      button.appendChild(count);
      button.addEventListener('click', function () { onChipClick(key); });
      els.chips.appendChild(button);
      chips.push({ key: key, button: button, count: count });
    }

    // The chips are built once and afterwards only updated: a chip rebuilt on every render
    // would take the keyboard focus with it when Enter or Space activates it.
    function buildChips() {
      createChip(ALL, 'All', null);
      GROUPS.forEach(function (group) { createChip(group.key, group.label, group); });
    }

    function updateChips(matched) {
      chips.forEach(function (chip) {
        chip.button.setAttribute('aria-pressed', chip.key === state.group ? 'true' : 'false');
        chip.count.textContent = String(chipCount(matched, chip.key));
      });
    }

    function card(entry) {
      var game = entry.game;
      var article = make('article', 'hub-card');
      var heading = make('h3', 'hub-card-title');
      var link = make('a', 'hub-card-link', game.name);
      article.style.setProperty('--hub-group', entry.group.color);
      // The link's ::after overlay covers the whole card, so the pointer is always over the
      // link: the full text of the clamped description is the link's tooltip (a title on the
      // paragraph would never show). On the link it is also the link's accessible description,
      // while its name stays the game's name and the card stays unnamed. Screen readers that
      // announce descriptions read the text twice (on the link, then the paragraph); that is
      // the accepted trade-off. Moving the title to the paragraph hides the tooltip again, and
      // moving it to the article makes the description the card's name.
      link.title = game.description;
      link.href = folderHref(game.folder, location.protocol);
      heading.appendChild(link);
      article.appendChild(heading);
      article.appendChild(make('p', 'hub-card-desc', game.description));
      return article;
    }

    function section(group, entries) {
      var node = make('section', 'hub-section');
      var heading = make('h2', 'hub-section-head');
      var grid = make('div', 'hub-grid');
      heading.id = 'hub-group-' + group.key;
      node.setAttribute('aria-labelledby', heading.id);
      heading.appendChild(dot(group));
      heading.appendChild(document.createTextNode(group.label));
      heading.appendChild(make('span', 'hub-section-n', String(entries.length)));
      entries.forEach(function (entry) { grid.appendChild(card(entry)); });
      node.appendChild(heading);
      node.appendChild(grid);
      return node;
    }

    // Rebuilds the list from the sections and returns how many games it shows.
    function renderList(sections) {
      var shown = 0;
      els.list.textContent = '';
      sections.forEach(function (item) {
        shown += item.entries.length;
        els.list.appendChild(section(item.group, item.entries));
      });
      return shown;
    }

    function renderStatus(shown) {
      els.count.textContent = countLabel(shown, GAMES.length);
      els.empty.hidden = shown !== 0;
      els.empty.textContent = shown ? '' : emptyMessage(state.query, state.group);
    }

    function render() {
      var words = queryWords(state.query);
      var matched = ENTRIES.filter(function (entry) { return matchesWords(entry, words); });
      renderStatus(renderList(sectionsFor(matched, state.group)));
      updateChips(matched);
    }

    // ---------- Input ----------

    function onSearchInput() {
      state.query = els.search.value.trim();
      render();
    }

    // Escape in a non-empty search box clears it; the chosen genre stays.
    function onSearchKeydown(event) {
      if (event.key !== 'Escape' || !els.search.value) return;
      els.search.value = '';
      state.query = '';
      render();
    }

    // '/' focuses the search box unless Ctrl, Meta or Alt is held (Shift is allowed: '/' is
    // Shift+7 on German keyboards) or the focus is already in a form field, where it types.
    function onDocumentKeydown(event) {
      if (event.key !== '/' || event.ctrlKey || event.metaKey || event.altKey) return;
      if (isFormField(document.activeElement)) return;
      event.preventDefault();
      els.search.focus();
    }

    function isFormField(node) {
      var tag = (node && node.tagName) || '';
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    function onChipClick(key) {
      state.group = nextGroup(state.group, key);
      render();
    }

    // ---------- Start-up ----------

    function init() {
      els = {
        stats: document.getElementById('hub-stats'),
        search: document.getElementById('hub-search'),
        count: document.getElementById('hub-count'),
        chips: document.getElementById('hub-chips'),
        list: document.getElementById('hub-list'),
        empty: document.getElementById('hub-empty'),
        footer: document.getElementById('hub-footer')
      };
      // The box is normally empty here (autocomplete is off and a back/forward restore does
      // not run init again); reading it anyway keeps the first render in step with the box.
      state.query = els.search.value.trim();
      renderHeader();
      buildChips();
      render();
      els.search.addEventListener('input', onSearchInput);
      els.search.addEventListener('keydown', onSearchKeydown);
      document.addEventListener('keydown', onDocumentKeydown);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
